services:
  # ============================================================================
  # Application Web Frontend Next.js (Parking BCRG - Port 3002)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5002}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://localhost:5002}
        NEXT_PUBLIC_BCRG_HUB_URL: ${NEXT_PUBLIC_BCRG_HUB_URL:-https://api-hub.bcrg.gn}
        NEXT_PUBLIC_BCRG_HUB_FRONTEND_URL: ${NEXT_PUBLIC_BCRG_HUB_FRONTEND_URL:-https://hub.bcrg.gn}
    container_name: parking_bcrg_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3002}
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5002}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://localhost:5002}
      - NEXT_PUBLIC_BCRG_HUB_URL=${NEXT_PUBLIC_BCRG_HUB_URL:-https://api-hub.bcrg.gn}
      - NEXT_PUBLIC_BCRG_HUB_FRONTEND_URL=${NEXT_PUBLIC_BCRG_HUB_FRONTEND_URL:-https://hub.bcrg.gn}
    networks:
      - parking_frontend_net

networks:
  parking_frontend_net:
    name: parking_frontend_net
