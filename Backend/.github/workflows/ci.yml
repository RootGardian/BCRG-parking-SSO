name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x] # Selon le README (Node 24 LTS)

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Installation des dépendances
      run: npm ci

    - name: Génération des types Prisma Next (Contract Emit)
      run: npm run contract:emit

    - name: Vérification de la compilation (TypeScript)
      run: npx tsc --noEmit
